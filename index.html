<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trip Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 2rem; color: #667eea; margin-bottom: 5px; }
        .logo p { color: #64748b; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 500;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Inter', sans-serif;
        }
        button:hover { transform: translateY(-2px); }
        .divider {
            text-align: center;
            margin: 25px 0;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .alt-action {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }
        .alt-action a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>✈️ Trip Planner</h1>
            <p>Welcome back!</p>
        </div>
        <div class="error" id="error"></div>
        <form id="form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit">Sign In</button>
        </form>
        <div class="divider">or</div>
        <div class="alt-action">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>
    <script>
        const sb = supabase.createClient('https://xwoxevuziypkcuplazdu.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3b3hldnV6aXlwa2N1cGxhemR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDUyNDUsImV4cCI6MjA5NDY4MTI0NX0.RTxipT-aTh_dxiOS72onfVfGEUlMOTNfLyOHy_ifWqw');
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('error');
            try {
                const { error } = await sb.auth.signInWithPassword({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                if (error) throw error;
                window.location.href = 'trip-planner-cloud.html';
            } catch (e) {
                err.textContent = e.message;
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
