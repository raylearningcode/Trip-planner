<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Trip Planner - Cloud Sync</title>
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://xwoxevuziypkcuplazdu.supabase.co">
    
    <!-- Critical CSS inline -->
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f23;color:#fff;overflow-x:hidden}
        .loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f0f23;display:flex;align-items:center;justify-content:center;z-index:9999}
        .spinner{width:50px;height:50px;border:3px solid #333;border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    
    <!-- Deferred non-critical CSS -->
    <link rel="preload" href="/styles/main.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/styles/main.css"></noscript>
    
    <!-- Leaflet CSS lazy loaded -->
    <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" as="style">
    
    <!-- Service Worker Registration -->
    <script>
        if('serviceWorker' in navigator){
            window.addEventListener('load',()=>{
                navigator.serviceWorker.register('/sw.js')
                    .then(r=>console.log('✅ SW registered'))
                    .catch(e=>console.log('❌ SW failed:',e));
            });
        }
    </script>
    
    <!-- IndexedDB Init -->
    <script>
        const DB_NAME='TripPlannerCache',DB_VERSION=1;
        let db;
        const initDB=()=>new Promise((resolve,reject)=>{
            const req=indexedDB.open(DB_NAME,DB_VERSION);
            req.onerror=()=>reject(req.error);
            req.onsuccess=()=>{db=req.result;resolve(db)};
            req.onupgradeneeded=e=>{
                const db=e.target.result;
                if(!db.objectStoreNames.contains('trips'))db.createObjectStore('trips',{keyPath:'id'});
                if(!db.objectStoreNames.contains('userData'))db.createObjectStore('userData',{keyPath:'userId'});
            };
        });
        initDB().then(()=>console.log('✅ Cache ready'));
    </script>
    
    <!-- Deferred external scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading" id="loadingScreen">
        <div class="spinner"></div>
    </div>
    
    <!-- App Container -->
    <div id="app" style="display:none"></div>
    
    <!-- Module Loading -->
    <script type="module">
        import { initSupabase, initCache } from '/scripts/core.js';
        import { renderApp } from '/scripts/app.js';
        
        // Initialize app
        (async () => {
            try {
                await Promise.all([
                    initSupabase(),
                    initCache()
                ]);
                
                await renderApp();
                
                // Hide loading, show app
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                
                console.log('✅ App ready');
            } catch(err) {
                console.error('❌ Init failed:', err);
                document.getElementById('loadingScreen').innerHTML = 
                    '<div style="text-align:center"><h2>⚠️ Failed to Load</h2><p>' + err.message + '</p></div>';
            }
        })();
        
        // Lazy load Leaflet when needed
        window.loadLeaflet = () => {
            if(window.L) return Promise.resolve();
            return new Promise((resolve,reject) => {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
                document.head.appendChild(link);
                
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        };
    </script>
    
    <!-- Preload images -->
    <link rel="preload" as="image" href="/icons/icon-192.png">
</body>
</html>
