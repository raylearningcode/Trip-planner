<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Trip Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            background: white;
            padding: 48px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1a1a2e;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 32px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #1a1a2e;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .link-text {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
        }
        
        .link-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .link-text a:hover {
            text-decoration: underline;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .success {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <div class="logo-icon">🏖️</div>
            <h1>Create Account</h1>
            <p class="subtitle">Start planning your dream trip</p>
        </div>
        
        <div id="errorMessage"></div>
        <div id="successMessage"></div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="6" autocomplete="new-password">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
            </div>
            
            <button type="submit" class="btn" id="signupBtn">Create Account</button>
        </form>
        
        <p class="link-text">
            Already have an account? <a href="index.html">Log in</a>
        </p>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://xwoxevuziypkcuplazdu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3b3hldnV6aXlwa2N1cGxhemR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDUyNDUsImV4cCI6MjA5NDY4MTI0NX0.RTxipT-aTh_dxiOS72onfVfGEUlMOTNfLyOHy_ifWqw';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const form = document.getElementById('signupForm');
        const signupBtn = document.getElementById('signupBtn');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        
        function showError(message) {
            errorDiv.innerHTML = `<div class="error">${message}</div>`;
            successDiv.innerHTML = '';
        }
        
        function showSuccess(message) {
            successDiv.innerHTML = `<div class="success">${message}</div>`;
            errorDiv.innerHTML = '';
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating account...';
            errorDiv.innerHTML = '';
            
            try {
                const { data, error } = await sb.auth.signUp({
                    email: email,
                    password: password
                });
                
                if (error) throw error;
                
                showSuccess('Account created! Check your email for verification, then you can log in.');
                form.reset();
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                
            } catch (error) {
                showError(error.message || 'Signup failed. Please try again.');
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create Account';
            }
        });
        
        // Check if already logged in
        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                window.location.href = 'app.html';
            }
        })();
    </script>
</body>
</html>
