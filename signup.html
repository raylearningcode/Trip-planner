<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Trip Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 2rem; color: #667eea; margin-bottom: 5px; }
        .logo p { color: #64748b; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 500;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Inter', sans-serif;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .divider {
            text-align: center;
            margin: 25px 0;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .alt-action {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }
        .alt-action a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .error, .success {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .error { background: #fee; color: #c00; }
        .success { background: #efe; color: #080; }
        .hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>✈️ Trip Planner</h1>
            <p>Create your account</p>
        </div>
        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
        <form id="form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="johndoe" pattern="[a-zA-Z0-9_]{3,20}" minlength="3" maxlength="20">
                <div class="hint">3-20 characters, letters, numbers, and underscore only</div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••" minlength="6">
                <div class="hint">At least 6 characters</div>
            </div>
            <button type="submit" id="submitBtn">Create Account</button>
        </form>
        <div class="divider">or</div>
        <div class="alt-action">
            Already have an account? <a href="index.html">Sign in</a>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://xwoxevuziypkcuplazdu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3b3hldnV6aXlwa2N1cGxhemR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDUyNDUsImV4cCI6MjA5NDY4MTI0NX0.RTxipT-aTh_dxiOS72onfVfGEUlMOTNfLyOHy_ifWqw';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('error');
            const suc = document.getElementById('success');
            const submitBtn = document.getElementById('submitBtn');
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            err.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
            
            try {
                // Check if username exists
                const { data: existingUser } = await sb
                    .from('profiles')
                    .select('username')
                    .eq('username', username)
                    .single();
                
                if (existingUser) {
                    throw new Error('Username already taken. Please choose another.');
                }
                
                // Create auth user
                const { data: authData, error: authError } = await sb.auth.signUp({
                    email: email,
                    password: password
                });
                
                if (authError) throw authError;
                
                // Create profile with username
                const { error: profileError } = await sb
                    .from('profiles')
                    .insert([{
                        id: authData.user.id,
                        username: username,
                        email: email,
                        created_at: new Date().toISOString()
                    }]);
                
                if (profileError) throw profileError;
                
                suc.textContent = '✅ Account created! Redirecting...';
                suc.style.display = 'block';
                setTimeout(() => window.location.href = 'trip-planner-cloud.html', 1500);
                
            } catch (e) {
                err.textContent = e.message;
                err.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
