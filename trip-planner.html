<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner Pro - Cloud Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>✈️ Trip Planner</h2>
            <div class="trip-dates" id="tripDatesDisplay"></div>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-page="overview">📊 Overview</a>
            <a href="#" class="nav-item" data-page="budget">💰 Budget</a>
            <a href="#" class="nav-item" data-page="savings">🏦 Savings</a>
            <a href="#" class="nav-item" data-page="destinations">📍 Destinations</a>
            <a href="#" class="nav-item" data-page="itinerary">🗓️ Itinerary</a>
            <a href="#" class="nav-item" data-page="bookings">🎫 Bookings</a>
            <a href="#" class="nav-item" data-page="packing">🎒 Packing</a>
            <a href="#" class="nav-item" data-page="group">👥 Group</a>
            <a href="#" class="nav-item" data-page="map">🗺️ Map</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="page active" id="overview">
            <div class="page-header">
                <h1 class="page-title">Trip Overview</h1>
                <p class="page-subtitle">Essential trip information</p>
            </div>
            <div id="overviewContent"></div>
        </div>
        <div class="page" id="budget"><div id="budgetContent"></div></div>
        <div class="page" id="savings"><div id="savingsContent"></div></div>
        <div class="page" id="destinations"><div id="destinationsContent"></div></div>
        <div class="page" id="itinerary"><div id="itineraryContent"></div></div>
        <div class="page" id="bookings"><div id="bookingsContent"></div></div>
        <div class="page" id="packing"><div id="packingContent"></div></div>
        <div class="page" id="group"><div id="groupContent"></div></div>
        <div class="page" id="map"><div id="mapContent"></div></div>
    </div>

    <div class="notification-bell" id="notificationBell" onclick="toggleNotifications()">
        🔔
        <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
    </div>

    <div class="notification-panel" id="notificationPanel"></div>

    <div class="quick-actions-fab" id="quickActionsFab" onclick="toggleQuickActions()">
        <span style="font-size: 24px;">⚡</span>
    </div>

    <div class="quick-actions-menu" id="quickActionsMenu"></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container">
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
